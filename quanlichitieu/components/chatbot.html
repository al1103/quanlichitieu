<!-- Chatbot AI: nút tròn nổi để mở/đóng + khung chat trượt ra.
     Hiện trên mọi trang sau khi đăng nhập, trả lời câu hỏi về thu chi của người dùng. -->

<button id="ai-chat-toggle-btn" class="fixed bottom-20 md:bottom-6 left-4 w-12 h-12 bg-slate-900 text-white rounded-full shadow-lg flex items-center justify-center z-40 hover:bg-slate-800 active:scale-95 transition-all">
  <i data-icon="message-circle" class="w-6 h-6"></i>
</button>

<div id="ai-chat-panel" class="hidden fixed bottom-36 md:bottom-24 left-4 z-50 w-[calc(100%-2rem)] max-w-sm h-[28rem] card flex flex-col overflow-hidden">

  <!-- Tiêu đề khung chat -->
  <div class="flex justify-between items-center px-4 py-3 border-b border-gray-100 bg-slate-900 text-white shrink-0">
    <div class="flex items-center gap-2">
      <i data-icon="sparkles" class="w-4 h-4"></i>
      <h3 class="text-sm font-semibold">Trợ lý tài chính AI</h3>
    </div>
    <button id="ai-chat-close-btn" class="text-slate-300 hover:text-white">
      <i data-icon="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Danh sách tin nhắn, main.js sẽ thêm tin nhắn mới vào đây -->
  <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm">
    <div class="bg-slate-100 text-slate-700 rounded-lg px-3 py-2 max-w-[85%]">
      Xin chào! Hỏi mình về thu chi của bạn, ví dụ: "Tháng này tiêu nhiều nhất vào đâu?"
    </div>
  </div>

  <!-- Ô nhập câu hỏi -->
  <div class="p-3 border-t border-gray-100 flex gap-2 shrink-0">
    <input id="ai-chat-input" type="text" placeholder="Nhập câu hỏi..." autocomplete="off" class="form-input flex-1" />
    <button id="ai-chat-send-btn" class="btn btn-primary px-3">
      <i data-icon="send" class="w-4 h-4"></i>
    </button>
  </div>
</div>
